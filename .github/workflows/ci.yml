# Automatic checks on GitHub (Prompt 15). Runs on every push and pull request.
# Two jobs run side by side:
#   pipeline: Python unit tests. Raw data is never in the repo, so tests that need
#             it skip themselves; the rest use test fixtures and committed outputs.
#   site:     unit tests, lint, validate-data, the build, and the Playwright tests.
# The same steps run on Zaden's PC with scripts\check-all.ps1.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest pipeline/tests -q -rs

  site:
    name: Site tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    env:
      # Not secrets: placeholders so the build's Content-Security-Policy allows a
      # *.supabase.co address. The waitlist test fakes the request; nothing is saved.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci

      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Validate data
        run: npm run validate-data

      - name: Cache the Next.js build cache
        uses: actions/cache@v4
        with:
          path: site/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}-${{ hashFiles('site/app/**', 'site/components/**', 'site/lib/**', 'site/public/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}-
      - name: Build
        run: npm run build

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install the Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install the browser's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Playwright tests
        run: npx playwright test

      - name: Save the Playwright report if a test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7
